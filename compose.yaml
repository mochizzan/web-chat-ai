services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-web-chat:latest
    container_name: ai-web-chat-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WS_PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - OMNIROUTER_BASE_URL=${OMNIROUTER_BASE_URL}
      - OMNIROUTER_API_KEY=${OMNIROUTER_API_KEY}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - WS_KEY=${WS_KEY}
      - WS_BROADCAST_KEY=${WS_BROADCAST_KEY}
      - TAVILY_API_KEY_1=${TAVILY_API_KEY_1}
      - TAVILY_API_KEY_2=${TAVILY_API_KEY_2}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      - BONUS_CREDIT_AMOUNT=${BONUS_CREDIT_AMOUNT}
      - DEFAULT_CREDIT_AMOUNT=${DEFAULT_CREDIT_AMOUNT}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
    networks:
      - mariadb_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-web-chat:latest
    container_name: ai-web-chat-ws
    command: ["sh", "-c", "pnpm ws"]
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - WS_PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - WS_BROADCAST_KEY=${WS_BROADCAST_KEY}
    networks:
      - mariadb_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  mariadb_net:
    external: true
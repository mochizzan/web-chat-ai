services:
  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-web-chat:latest
    container_name: ai-web-chat-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WS_PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - OMNIROUTER_BASE_URL=${OMNIROUTER_BASE_URL}
      - OMNIROUTER_API_KEY=${OMNIROUTER_API_KEY}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL}
      - WS_KEY=${WS_KEY}
      - WS_BROADCAST_KEY=${WS_BROADCAST_KEY}
      - TAVILY_API_KEY_1=${TAVILY_API_KEY_1}
      - TAVILY_API_KEY_2=${TAVILY_API_KEY_2}
      - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME}
      - BONUS_CREDIT_AMOUNT=${BONUS_CREDIT_AMOUNT}
      - DEFAULT_CREDIT_AMOUNT=${DEFAULT_CREDIT_AMOUNT}
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_APP_PASSWORD=${EMAIL_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WebSocket Server
  websocket:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-web-chat:latest
    container_name: ai-web-chat-ws
    command: ["sh", "-c", "pnpm ws"]
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - WS_PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - WS_BROADCAST_KEY=${WS_BROADCAST_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ai-chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: ai-web-chat-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=ServBay.dev
      - MYSQL_DATABASE=ai_chat_web
      - MYSQL_USER=ai_chat_user
      - MYSQL_PASSWORD=ai_chat_password
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - ai-chat-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pServBay.dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  ai-chat-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local